<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vinay N M">
<title>Vinay N M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --ground:#EEF1F8;
  --sheet:#FFFFFF;
  --tile:#F7F9FD;
  --tile-2:#EFF3FB;
  --text:#101728;
  --text-2:#4B5872;
  --text-3:#7C88A3;
  --line:#E3E8F2;
  --line-strong:#D3DBEA;
  --accent:#4560FF;
  --accent-2:#8B5CF6;
  --accent-soft:rgba(69,96,255,.10);
  --good:#16A34A;
  --shadow:0 1px 2px rgba(16,23,40,.05), 0 12px 34px -18px rgba(16,23,40,.30);
  --shadow-lift:0 2px 6px rgba(16,23,40,.06), 0 26px 50px -24px rgba(16,23,40,.38);

  /* the hero keeps its night sky in every theme — it is the signature */
  --night-1:#070D22;
  --night-2:#0B1435;
  --night-3:#141F4A;
  --night-text:#F2F5FF;
  --night-text-2:#97A5CC;
  --night-line:rgba(255,255,255,.10);
  --night-fill:rgba(255,255,255,.055);

  --radius:16px;
  --radius-lg:24px;
  --rail:236px;
  --maxw:1180px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#05091A;
    --sheet:#0E1530;
    --tile:#141C3A;
    --tile-2:#18204A;
    --text:#E9EEFB;
    --text-2:#9AA6C6;
    --text-3:#7C88A8;
    --line:rgba(255,255,255,.09);
    --line-strong:rgba(255,255,255,.16);
    --accent:#7E93FF;
    --accent-2:#A78BFA;
    --accent-soft:rgba(126,147,255,.14);
    --good:#34D399;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.8);
    --shadow-lift:0 2px 8px rgba(0,0,0,.45), 0 28px 54px -26px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#05091A;
  --sheet:#0E1530;
  --tile:#141C3A;
  --tile-2:#18204A;
  --text:#E9EEFB;
  --text-2:#9AA6C6;
  --text-3:#7C88A8;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --accent:#7E93FF;
  --accent-2:#A78BFA;
  --accent-soft:rgba(126,147,255,.14);
  --good:#34D399;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.8);
  --shadow-lift:0 2px 8px rgba(0,0,0,.45), 0 28px 54px -26px rgba(0,0,0,.9);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation-duration:.001ms!important;transition-duration:.001ms!important} }
body{
  margin:0;
  background:var(--ground);
  color:var(--text);
  font-family:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:"Outfit",ui-sans-serif,system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.14}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.eyebrow{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);display:flex;align-items:center;gap:8px;
}
.eyebrow::before{content:"";width:14px;height:2px;border-radius:2px;background:currentColor;opacity:.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- rail ---------- */
.rail{
  position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:40;
  padding:calc(26px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:26px;
  background:linear-gradient(180deg,var(--night-1),var(--night-2));
  border-right:1px solid var(--night-line);
}
.brand{font-family:"Outfit";font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--night-text);padding-left:10px}
.brand span{color:var(--accent-2)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  color:var(--night-text-2);font-size:14px;font-weight:600;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.nav a:hover{color:var(--night-text);background:var(--night-fill)}
.nav a[aria-current="true"]{
  color:#fff;background:linear-gradient(135deg,var(--accent),#5C4BE0);
  box-shadow:0 10px 24px -14px rgba(69,96,255,.95);
}
.nav a[aria-current="true"] svg{opacity:1}
.rail-foot{margin-top:auto;padding-left:12px;font-size:11.5px;color:var(--night-text-2);line-height:1.5}
.rail-foot b{display:block;color:var(--night-text);font-weight:600;font-size:12.5px}

/* ---------- shell ---------- */
.shell{margin-left:var(--rail)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:clamp(18px,3vw,40px)}

/* ---------- top actions ---------- */
.topbar{
  position:fixed;top:calc(22px + env(safe-area-inset-top,0px));right:clamp(18px,3vw,40px);
  display:flex;align-items:center;gap:12px;z-index:20;
}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:var(--night-text-2);border:1px solid transparent;transition:.18s ease;
}
.icon-btn:hover{color:var(--night-text);background:var(--night-fill);border-color:var(--night-line)}
.icon-btn svg{width:18px;height:18px}
.cv-btn{
  display:inline-flex;align-items:center;gap:9px;padding:10px 17px;border-radius:12px;
  border:1px solid var(--night-line);background:var(--night-fill);color:var(--night-text);
  font-size:13.5px;font-weight:600;backdrop-filter:blur(8px);transition:.18s ease;
}
.cv-btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.cv-btn svg{width:16px;height:16px}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(900px 520px at 78% -6%, rgba(139,92,246,.30), transparent 62%),
    radial-gradient(760px 480px at 8% 108%, rgba(69,96,255,.26), transparent 64%),
    linear-gradient(160deg,var(--night-1) 0%,var(--night-2) 52%,#0A1230 100%);
  color:var(--night-text);
  padding-block:clamp(78px,10vw,112px) clamp(84px,9vw,110px);
}
.hero::after{ /* faint circuit grid, drawn not decorated: the CS thread */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--night-line) 1px,transparent 1px),linear-gradient(90deg,var(--night-line) 1px,transparent 1px);
  background-size:62px 62px;
  mask-image:radial-gradient(800px 460px at 30% 30%,#000,transparent 75%);
  -webkit-mask-image:radial-gradient(800px 460px at 30% 30%,#000,transparent 75%);
}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(28px,5vw,64px);align-items:center}
.hello{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--night-text-2)}
.hero h1{font-size:clamp(40px,5.6vw,66px);font-weight:800;margin:14px 0 6px;letter-spacing:-.035em}
.hero h1 .dot{color:var(--accent-2)}
.role{font-family:"Outfit";font-size:clamp(19px,2.3vw,26px);font-weight:600;
  background:linear-gradient(92deg,#7E93FF,#C4B5FD);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lede{margin-top:16px;max-width:52ch;color:var(--night-text-2);font-size:15.5px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:13px;font-size:14.5px;font-weight:700;font-family:"Outfit";transition:.2s ease}
.btn svg{width:16px;height:16px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#7B5CF0);color:#fff;box-shadow:0 16px 34px -16px rgba(91,80,240,.95)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 22px 40px -16px rgba(91,80,240,1)}
.btn-primary .arrow{transition:transform .2s ease}
.btn-primary:hover .arrow{transform:translateX(3px)}
.btn-ghost{border:1px solid var(--night-line);background:var(--night-fill);color:var(--night-text)}
.btn-ghost:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.socials{display:flex;gap:10px;margin-top:26px}
.socials a{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  border:1px solid var(--night-line);background:var(--night-fill);color:var(--night-text-2);transition:.2s ease;
}
.socials a:hover{color:#fff;border-color:rgba(126,147,255,.6);background:rgba(126,147,255,.18);transform:translateY(-3px)}
.socials svg{width:17px;height:17px}

.portrait-col{position:relative;display:flex;justify-content:center}
.portrait{position:relative;width:clamp(210px,26vw,290px);aspect-ratio:1;border-radius:50%;
  padding:6px;background:conic-gradient(from 200deg,var(--accent),#A78BFA,#38BDF8,var(--accent));
  box-shadow:0 0 0 12px rgba(126,147,255,.08),0 40px 80px -32px rgba(69,96,255,.75);
}
.portrait-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#25304F,#161E3C);display:grid;place-items:center;position:relative}
.portrait-inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.monogram{font-family:"Outfit";font-weight:800;font-size:64px;letter-spacing:-.04em;color:#8FA3FF}
.monogram small{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:400;letter-spacing:.16em;color:var(--night-text-2);margin-top:6px}
.script{position:absolute;top:-46px;right:6%;z-index:2;font-family:"Caveat",cursive;font-size:clamp(20px,2.4vw,27px);line-height:1.1;color:var(--night-text);text-align:center;opacity:.92;white-space:nowrap}
.script svg{width:70px;height:11px;display:block;margin:2px auto 0;color:var(--accent-2)}
.status{
  position:absolute;bottom:4%;right:-4%;z-index:2;display:flex;align-items:center;gap:10px;
  padding:11px 15px;border-radius:14px;background:rgba(14,21,48,.92);border:1px solid var(--night-line);
  font-size:12.5px;font-weight:600;color:var(--night-text);line-height:1.3;backdrop-filter:blur(10px);
  box-shadow:0 20px 40px -22px rgba(0,0,0,.9);max-width:170px;
}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

/* ---------- sheet ---------- */
.sheet{
  position:relative;z-index:2;background:var(--sheet);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;margin-top:-30px;
  border:1px solid var(--line);border-bottom:0;
}
.section{padding-block:clamp(44px,5.5vw,68px);border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.section-head h2{font-size:clamp(25px,3.2vw,34px);font-weight:700;margin-top:10px}
.section-head h2 em{font-style:normal;background:linear-gradient(92deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.link-more{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--accent);font-family:"Outfit"}
.link-more svg{width:14px;height:14px;transition:transform .2s ease}
.link-more:hover svg{transform:translateX(3px)}

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(26px,4vw,56px);align-items:start}
.about-body{color:var(--text-2);max-width:56ch;margin-top:18px;font-size:15.2px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.fact{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--tile);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-2)}
.fact svg{width:14px;height:14px;color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{background:var(--tile);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 18px;box-shadow:var(--shadow);transition:.2s ease}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.stat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:16px}
.stat .ic svg{width:19px;height:19px}
.stat .num{font-family:"Outfit";font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:12.5px;color:var(--text-3);font-weight:600;margin-top:2px}

/* skills */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
.chip{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600;font-size:14px;transition:.2s ease}
.chip:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:var(--shadow-lift)}
.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:"Outfit";font-weight:700;font-size:13px;color:#fff;flex:none;letter-spacing:-.02em}
.core{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.core .label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.tag{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}

/* projects */
.projects{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.project{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:20px;transition:.25s ease}
.project:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--line-strong)}
.project h3{font-size:18.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.project h3 svg{width:14px;height:14px;color:var(--text-3)}
.p-head{display:flex;gap:13px;align-items:flex-start}
.p-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.p-ic svg{width:20px;height:20px}
.p-meta{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-3);margin-top:4px}
.project p{color:var(--text-2);font-size:14.2px;margin-top:14px}
.p-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.p-tags span{padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--tile-2);color:var(--text-2)}
.p-link{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-size:13px;font-weight:700;color:var(--accent);font-family:"Outfit"}
.p-link svg{width:13px;height:13px}
.mock{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0B1226;align-self:stretch;min-height:150px}
.mock svg{width:100%;height:100%;display:block}

/* tri column */
.tri{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,3.5vw,44px)}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.col-head h2{font-size:21px;font-weight:700}

.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2));opacity:.35;border-radius:2px}
.tl-item{position:relative;padding-bottom:22px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--sheet);box-shadow:0 0 0 2px var(--accent-soft)}
.tl-item h4{font-size:15px;font-weight:700}
.tl-item .sub{font-size:13.2px;color:var(--text-2);margin-top:3px}
.tl-item .when{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--text-3);margin-top:4px}

.certs li{display:flex;gap:13px;padding:13px 0;border-bottom:1px dashed var(--line)}
.certs li:last-child{border-bottom:0}
.certs .mark{width:34px;height:34px;border-radius:10px;font-size:11px}
.certs h4{font-size:14.3px;font-weight:700;line-height:1.35}
.certs .when{font-family:"JetBrains Mono",monospace;font-size:11.3px;color:var(--text-3);margin-top:3px}

.wins li{display:flex;gap:12px;align-items:flex-start;padding:11px 0}
.wins .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.wins .ic svg{width:15px;height:15px}
.wins p{font-size:13.6px;color:var(--text-2)}
.wins b{color:var(--text);font-weight:700}

/* contact */
.contact{
  background:
    radial-gradient(700px 320px at 12% 0%, rgba(69,96,255,.30), transparent 65%),
    radial-gradient(620px 300px at 88% 100%, rgba(139,92,246,.26), transparent 62%),
    linear-gradient(140deg,var(--night-1),var(--night-2));
  color:var(--night-text);padding-block:clamp(44px,5.5vw,64px);
}
.contact-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center}
.contact h2{font-size:clamp(24px,3vw,32px);font-weight:700;margin-top:12px}
.contact p{color:var(--night-text-2);margin-top:12px;max-width:50ch;font-size:14.8px}
.contact-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:flex-end}
.reach{display:grid;gap:10px;width:100%;max-width:330px}
.reach a{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:13px;border:1px solid var(--night-line);background:var(--night-fill);transition:.2s ease}
.reach a:hover{background:rgba(126,147,255,.16);border-color:rgba(126,147,255,.5);transform:translateX(3px)}
.reach svg{width:16px;height:16px;color:var(--night-text-2);flex:none}
.reach .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--night-text-2)}
.reach .v{font-size:13.6px;font-weight:600;word-break:break-all}

footer.base{background:var(--night-1);color:var(--night-text-2);border-top:1px solid var(--night-line);padding-block:20px calc(20px + env(safe-area-inset-bottom,0px))}
.base-in{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;font-size:12.6px}
.base-in nav{display:flex;gap:18px;flex-wrap:wrap}
.base-in nav a:hover{color:var(--night-text)}

/* reveal — from a visible resting state */
.rv{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
@media (prefers-reduced-motion: no-preference){
  .js .rv{opacity:0;transform:translateY(14px)}
  .js .rv.in{opacity:1;transform:none}
}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  :root{--rail:0px}
  .rail{
    position:sticky;top:0;bottom:auto;width:auto;height:auto;flex-direction:row;align-items:center;gap:16px;
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-right:0;border-bottom:1px solid var(--night-line);
  }
  .nav{flex-direction:row;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 12px;white-space:nowrap;font-size:13px}
  .nav a svg{display:none}

  var sun='<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>';

  function paint(){

      (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    icon.innerHTML = dark ? sun : moon;

  paint();

      (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);

    paint();
  });
})();

/* scroll spy */
(function(){
  var links=[].slice.call(document.querySelectorAll('.nav a'));
  var map={}; links.forEach(function(a){ var el=document.querySelector(a.getAttribute('href')); if(el) map[a.getAttribute('href').slice(1)]=a; });
  var sections=Object.keys(map).map(function(id){ return document.getElementById(id); }).filter(Boolean);
  if(!('IntersectionObserver' in window)) return;
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        links.forEach(function(a){ a.removeAttribute('aria-current'); });
        map[e.target.id].setAttribute('aria-current','true');
      }
    });
  },{rootMargin:'-45% 0px -50% 0px',threshold:0});
  sections.forEach(function(s){ io.observe(s); });
})();

/* reveal */
(function(){
  var items=[].slice.call(document.querySelectorAll('.rv'));
  if(!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches){
    items.forEach(function(el){ el.classList.add('in'); }); return;
  }
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e,i){
      if(e.isIntersecting){ e.target.style.transitionDelay=(i*55)+'ms'; e.target.classList.add('in'); io.unobserve(e.target); }
    });
  },{rootMargin:'0px 0px -8% 0px',threshold:.08});
  items.forEach(function(el){ io.observe(el); });
  // anything already on screen resolves immediately
  requestAnimationFrame(function(){ items.forEach(function(el){ if(el.getBoundingClientRect().top < innerHeight){ el.classList.add('in'); } }); });
})();
